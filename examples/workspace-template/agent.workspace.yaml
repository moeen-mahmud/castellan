# Workspace wiring — paste into your agent.yaml
#
# Supersedes the flat `context.files` list in docs/02-SPEC-MANIFEST.md.
# The flat list gave no way to separate cacheable from volatile content, and no recency
# position at all. See docs/07-SPEC-WORKSPACE.md for the full field reference.

model:
  main:
    id: qwen3-8b-instruct
    baseUrl: https://api.example.com/v1
    apiKeyEnv: MODEL_API_KEY

    capabilities:
      # promptStyle controls how authored files are RENDERED for this model.
      # You author markdown with <example> delimiters once; the runtime adapts.
      promptStyle:
        delimiters: plain       # xml | markdown | plain
        intensity: emphatic     # emphatic | neutral | soft
        examplesIn: system      # system | user
        skillsIn: system        # system | user

# Shipped defaults by model class (override only when measurement disagrees):
#
#   claude-*          delimiters: xml       intensity: neutral   examplesIn: system
#   gpt-*, o*         delimiters: markdown  intensity: neutral   examplesIn: user
#   <14B open-weight  delimiters: plain     intensity: emphatic  examplesIn: system
#
# delimiters — Anthropic recommends XML because Claude was trained on it. Cross-model
#   studies find no reliable markdown advantage and a 22-37% token penalty for structured
#   formats. Per-model is the only honest answer.
#
# intensity — Anthropic now advises REMOVING emphatic phrasing ("CRITICAL: You MUST" ->
#   "Use this tool when") because frontier models overtrigger on it. Small models have the
#   opposite failure mode. Same file, different register.
#
# examplesIn — Anthropic puts examples in the system prompt in <example> tags. OpenAI says
#   tone and role go in the system message while task-specific detail and examples go in
#   user messages. Genuinely unresolved; settle it with the Phase 3 eval, not by picking a
#   vendor. Same applies to skillsIn.

context:
  window: 32768
  reserveOutput: 4096
  observationMaxTokens: 2000

  workspace: ./workspace

  # Tier 0 — static, cached, read-only to the agent.
  # Order matters: earlier rules are favoured under moderate instruction density.
  # Everything here sits BEFORE cache breakpoint A and must be byte-stable across turns.
  static:
    - AGENT.md
    - POLICY.md

  # Tier 1 — volatile. AFTER the breakpoint, so writes don't invalidate the cached prefix.
  volatile:
    - USER.md
    - MEMORY.md

  # Tier 2 — injected after conversation history, immediately before the current input.
  # Omit for short-lived agents; drift isn't a problem under ~10 turns.
  reminder: REMINDER.md

  budgets:
    static: 700
    volatile: 500
    reminder: 60
    total: 1300          # hard cap. Load fails over budget, naming the file.

  # Rule-count guard. Counts imperatives across static + reminder and fails the load if
  # the count exceeds what the reliability target permits at the configured per-rule rate.
  # Measure perRuleSuccess on YOUR model with `castellan eval rules` — don't guess.
  rules:
    perRuleSuccess: 0.90
    reliabilityTarget: 0.80
    onExceed: fail           # fail | warn

  # Injected automatically when compaction is enabled. Without it, models sense the
  # approaching limit and wrap up work early on their own. Generated by the runtime,
  # because the user doesn't know the thresholds. Set false to suppress.
  compactionNotice: true

  thresholds:
    trim: 0.60
    snip: 0.70
    micro: 0.80
    collapse: 0.88
    reset: 0.95

# Tier 3 — not pinned.
knowledge:
  dir: ./workspace/knowledge
  maxActive: 2
  budget: 600           # total across entries activated in one turn

skills:
  dir: ./workspace/skills
  maxActive: 1
  threshold: 0.35

memory:
  retriever: fts5
  dir: ./memory
  k: 6

# NOTE on the rules guard
# ----------------------
# At perRuleSuccess 0.90:  n=1 -> 0.90   n=2 -> 0.81   n=3 -> 0.73
#                          n=4 -> 0.66   n=6 -> 0.53   n=10 -> 0.35
#
# So reliabilityTarget 0.80 genuinely permits TWO rules, not four. The runtime computes
# this exactly rather than trusting this comment — the arithmetic is unintuitive and
# everyone underestimates it.
#
# If you need more rules than the budget allows, enforce them in code via wrapToolCall
# middleware. Do not raise the target.
