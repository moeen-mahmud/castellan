# The reference manifest: every field `agent.yaml` accepts, in one place.
#
# Runnable as it stands. Everything a phase has not delivered yet is present but commented, with
# the phase that unlocks it — so completing a phase means uncommenting a block here and watching it
# work, rather than discovering the field name in a spec.
#
# The commenting is not cosmetic. A section this build does not implement is **refused at load**,
# naming the phase, rather than parsed and ignored: a runtime that silently drops configuration
# lies about what it is doing. Uncomment `channels` today and the load fails on purpose.
#
# `docs/02-SPEC-MANIFEST.md` is the binding reference. This file is the worked copy.

apiVersion: castellan/v1
id: reference
name: Milo (Reference Assistant)

# Path to a base manifest. Shallow merge; arrays replace rather than concatenate.
# extends: ./base.agent.yaml

# ── model ─────────────────────────────────────────────────────────────────────────────────
# Three roles. `main` is required; `selector` and `compactor` fall back to it.
model:
  main:
    # Sent verbatim as the `model` parameter.
    id: ${MODEL_ID}
    # Must end at the version segment. The runtime appends `/chat/completions`.
    baseUrl: ${MODEL_BASE_URL}
    # The *name* of an env var. A literal key here fails validation — rule 2.
    apiKeyEnv: MODEL_API_KEY
    temperature: 0.3

    # How much the model may deliberate before answering. Sent as OpenAI's `reasoning_effort`,
    # omitted entirely when unset. Worth setting to `none` on a reasoning model doing short,
    # well-specified work: measured on qwen3.5:9b, six simultaneous rules with reasoning on burned
    # 2000 output tokens in 104s and returned EMPTY content, while `none` answered in 2.1s.
    # Not every endpoint honours it, and one that ignores it says nothing — verify per endpoint.
    # reasoningEffort: none      # none | minimal | low | medium | high
    # topP: 0.95
    # maxTokens: 4096
    # headers:
    #   x-my-gateway-tenant: ${TENANT_ID}

    # `stream_options: {include_usage: true}` — an OpenAI extension, so off by default because an
    # endpoint that does not know it may reject the whole request. Measured: Ollama reports no usage
    # without it, so local token counts come from the estimator until this is set. Turn it on when a
    # token figure is being compared rather than displayed.
    # streamUsage: true

    # Override the shipped capability registry only when it is wrong for your endpoint. These affect
    # thinking-block replay and cache-breakpoint placement, and never the tool dialect.
    # capabilities:
    #   nativeTools: true
    #   strictSchema: false
    #   # none | anthropic | openai | deepseek — what the loop must *do* with reasoning, not
    #   # whether the model reasons. `deepseek` bills reasoning to the output budget, so
    #   # reserveOutput must cover thinking *plus* the answer.
    #   thinking: deepseek
    #   promptCache: none
    #   parallelToolCalls: false
    #   contextWindow: 32768
    #   maxOutput: 8192
    #   # Phase 3.5 — how authored workspace files are rendered for this model.
    #   promptStyle:
    #     delimiters: plain     # xml | markdown | plain
    #     intensity: emphatic   # emphatic | neutral | soft
    #     examplesIn: system    # system | user
    #     skillsIn: system      # system | user

  # A cheap model for tool selection and summarisation. `$ref` reuses a role without repeating it.
  # selector:
  #   id: ${SELECTOR_MODEL_ID}
  #   baseUrl: ${MODEL_BASE_URL}
  #   apiKeyEnv: MODEL_API_KEY
  # compactor: { $ref: model.selector }

# ── context ───────────────────────────────────────────────────────────────────────────────
context:
  # Defaults to the model's `contextWindow` capability. Set it to spend less than the window.
  # window: 32768

  # Held back for the reply. Generous on purpose: a reasoning model bills its thinking here too,
  # and too small a reserve returns empty content with finish_reason=length.
  reserveOutput: 8192

  # Above this, one tool observation is cut to head+tail with the removed size named.
  observationMaxTokens: 2000

  # ── The tiered workspace (Phase 3.5) ──
  # This replaces the flat `context.files` list, which remains as a deprecated alias and warns at
  # load. A flat array cannot say which files are cache-stable, which sit after the conversation
  # history, or which the agent may write to — and each of those has a measured cost when got
  # wrong. See docs/07-SPEC-WORKSPACE.md.

  # Where the tier lists resolve from. This example keeps its files beside the manifest; a real
  # agent usually points this at ./workspace — see examples/workspace-template.
  workspace: .

  # Tier 0 — slot 0, before cache breakpoint A, read-only. Byte-stable across turns, or prompt
  # caching stops working with no error anywhere.
  #
  # This example takes its identity from `soul` below — the selected file (full or compact)
  # loads first in this tier automatically, and listing a second identity document would ship
  # two contradicting ones. AGENTS.md is not identity: it is operations — what Milo does and
  # how, per decision 11.19 — which is why the two coexist.
  static:
    - AGENTS.md

  # Tier 1 — slot 3, AFTER the breakpoint, so a memory write leaves the cached prefix untouched.
  # `memory_write` lands in the first file here whose frontmatter allows it.
  # volatile:
  #   - USER.md
  #   - MEMORY.md

  # Tier 2 — slot 9, after the conversation history and before the current input. One or two
  # rules, re-asserted because adherence decays and attention is weakest in the middle.
  # reminder: REMINDER.md

  # Compaction ladder trigger fractions. Must be strictly ascending; validated at load.
  thresholds:
    trim: 0.60
    snip: 0.70
    micro: 0.80
    collapse: 0.88
    reset: 0.95

  budgets:
    static: 2000
    volatile: 5500
    reminder: 500
    total: 8000                # hard cap. Over budget fails the load naming the file.
  # Imperative count across static + reminder, against what the target affords. The runtime
  # computes the allowance rather than trusting a table — the arithmetic is unintuitive and
  # authors consistently overestimate it.
  rules:
    perRuleSuccess: 0.90        # measure it with `eval rules`, do not guess
    reliabilityTarget: 0.80     # at 0.90 per rule this permits TWO rules, not four
    onExceed: fail              # fail | warn
  # ── Phase 3.5: capability-gated long-form identity ──
  # SOUL.md ships only to a model meeting `requires`; anything else gets the hand-edited
  # compact file. `soul distill SOUL.md` scaffolds it — headings and <rules> survive verbatim,
  # prose becomes placeholders a person fills. Distillation is never automatic: a summariser
  # drops exactly the parts that produce voice.
  soul:
    file: SOUL.md
    requires: { contextWindow: ">=200000", class: frontier }
    onUnmet: distill             # distill | omit | fail
    distilled: SOUL.compact.md   # required by distill; its absence is a load failure
  # compactionNotice: true       # Phase 7 — stops the model wrapping up early on budget grounds

# ── tools ─────────────────────────────────────────────────────────────────────────────────
tools:
  # Config only, never auto-detected: behaviour must not drift when the model changes. `nlt` is
  # the default on measured evidence — see evals/tools/README.md.
  dialect: nlt

  # Built-in tools, resolved from memory. Never sent to a remote provider.
  local:
    - now             # read-only: runs in parallel with other reads
    - memory_write    # mutating: serialises, holds a reserved write slot, never retried

  budget:
    max: 24
    # Slots held for mutating tools so a large read surface cannot starve the writes.
    reserveWrite: 6

  # ── The system provider: shell and file access ──
  # `@castellan/tools-system`, registered by the `castellan` binary. Nothing is implied — selecting
  # the provider AND pinning the tool are both required, the same way tools.local is opt-in.
  #
  # `exec` takes command, workdir, timeoutMs, pty and background. It takes no `env` argument on
  # purpose: a per-call environment map is invisible to the policy rules, which match the command
  # string, so `PATH=/tmp/evil` beside `git status` would pass a rule that never saw it. Written
  # inline it is part of the command and the rule does not match. The ambient environment IS
  # inherited, including this agent's .env — a pinned `exec` can read every secret the agent can.
  #
  # provider: system
  # pinned:
  #   - file_read      # untrusted: a file on disk may have been downloaded a minute ago
  #   - glob           # find files by name — * stays in one directory, ** crosses them
  #   - grep           # find lines by regex, with an optional file glob
  #   - file_write     # trusted output: it reports what it wrote, never the content
  #   - file_edit      # exact unique match, never a line number; two matches is a failure
  #   - exec           # the last resort — its target is a string no rule can look inside
  #
  # The file tools refuse to write this manifest, SOUL.md, AGENTS.md, POLICY.md, the policy file, or
  # anything under .ssh/.aws/.kube — and no allow rule reaches past that. USER.md and MEMORY.md stay
  # writable: they are the tier memory_write appends to. None of it binds `exec`, whose target lives
  # inside a shell string, which is why the descriptions push the model at the structured tools.

  # ── A remote provider ──
  # Registered by the embedder — nothing installs at runtime. The `castellan` binary registers
  # `composio` already. Run `castellan tools ./agent.yaml --warm` once before starting: resolution
  # happens during boot, where no network call is permitted, so a cold cache fails the load naming
  # the slugs and that command.
  #
  # provider: composio
  # providerConfig:
  #   apiKeyEnv: COMPOSIO_API_KEY   # the variable's name, never the key
  #   userId: me
  # pinned:
  #   - GMAIL_FETCH_EMAILS
  #   - GOOGLECALENDAR_EVENTS_LIST

  # ── tools.search is about finding a TOOL, not searching the web ──
  # This exposes a meta-tool that searches the *provider's catalogue* — 25,438 tools, in Composio's
  # case — so the model can discover a tool it was not given. Off by design in v1 and refused if
  # enabled: search-then-execute is two-hop reasoning, which is exactly where small models fail. Pin
  # what the agent needs instead.
  #
  # If you want the agent to search the *internet*, that is `web_search` below, or a pinned Composio
  # tool such as COMPOSIO_SEARCH_SEARCH. Nothing to do with this field.
  search:
    enabled: false

  # ── Phase 3.6: web search and page fetching ──
  # First-party, provider-agnostic. `web_search` returns results; `web_fetch` returns one page as
  # text. Both are read-only, and both are marked `trust: untrusted` — their output is text a
  # stranger wrote, so it is delimited as data and cannot silently drive a mutating tool in the same
  # turn. See docs/05-PLAN.md Phase 3.6.
  #
  # web:
  #   backend: tavily              # tavily | brave | exa
  #   apiKeyEnv: TAVILY_API_KEY    # the variable's name, never the key
  #   maxBytes: 2000000            # stop reading a page here, before extraction
  #   timeoutMs: 15000
  #   # Loopback, link-local and private ranges are refused outright. Only turn this off for a
  #   # deliberately sandboxed network — it is the SSRF boundary.
  #   allowPrivateHosts: false
  #
  # ── Which calls run, which ask, and which are refused ──
  # A second layer under pinning, for tools too broad to authorise wholesale — `exec` above all.
  # Evaluation is deny → allow, first match, and specificity never reorders it, so a deny rule
  # carries no exceptions. A rule naming a primary content field — exec(command:rm *) — is refused
  # at load: a compound command defeats it, and a rule that can be defeated reads as protection.
  #
  # A handful of commands are refused below every one of these settings and cannot be re-enabled:
  # `rm -rf /` and `rm -rf ~`, --no-preserve-root, fork bombs, mkfs, dd to a block device.
  policy:
    # allow | ask | deny — what happens to a call no rule mentions. `allow` because pinning is the
    # primary authorisation here: this agent has exactly the tools listed above. `ask` on an
    # unattended run means onNoApprover answers it, and a scheduled agent would do nothing at all.
    mode: allow
    allow: []
    deny: []
    # What `ask` means with nobody to ask — a schedule, a pipe, a channel with no approver.
    onNoApprover: deny

  # What to do when untrusted output is in the turn and the model asks for a mutating tool.
  # `refuse` is the default: the call is blocked and the model is told to ask the person instead.
  # `confirm` asks when someone is reachable and refuses when nobody is.
  untrusted:
    onMutate: refuse             # refuse | confirm | allow

  # A tainted mutating call needs EXPLICIT authorisation — a policy.allow rule you wrote, or a live
  # approval you gave. `mode: allow` is the absence of a rule, not one, so it does not satisfy this.
  #
  # The consequence worth knowing before you pin `exec`: its own output is untrusted (curl is the
  # internet), so its first call taints the turn and its second is refused. That is the gate working,
  # and the load says so by name rather than letting you find out mid-turn. The fix is one line —
  #
  #   policy:
  #     allow: ["exec"]              # or narrower: "exec(git *)", "exec(npm test:*)"
  #
  # — or `onMutate: confirm` to be asked each time.

# ── limits ────────────────────────────────────────────────────────────────────────────────
limits:
  # Steps per turn before forced termination, reported as `reason: max_steps`. A two-tool chain
  # needs three: call, observe, reply. This leaves room for one repair.
  maxSteps: 8
  # Must exceed any upstream timeout on the model endpoint.
  turnTimeoutMs: 300000
  toolTimeoutMs: 30000
  # Read-only tools only. Mutating tools always serialise, whatever this says.
  maxParallelTools: 4

# ── Phase 7: phase-scoped tool visibility ─────────────────────────────────────────────────
# The strongest published small-model lever: constraining the tool space per phase took local
# models from 2/10 to 10/10 on a benchmark subset with no model change.
#
# phases:
#   triage:
#     entry: true
#     allow: ["now", "tag:read"]     # slugs, `tag:<name>`, or `*`
#   act:
#     allow: ["*"]

# ── Phase 5: skills ───────────────────────────────────────────────────────────────────────
# skills:
#   dir: ./skills
#   maxActive: 1
#   threshold: 0.35        # normalised BM25 floor; below it nothing activates
#   sources: []

# ── Phase 3.5: knowledge — Tier 3, retrieved and never pinned ─────────────────────────────
# Entries activate when the current input mentions one of their frontmatter keywords, at most
# maxActive per turn and at most budget tokens between them. An entry over the whole budget
# fails the load — it could never activate, and silently unreachable is the one wrong answer.
knowledge:
  dir: ./knowledge
  maxActive: 2
  budget: 600

# ── Phase 6: memory ───────────────────────────────────────────────────────────────────────
# FTS5 over memory markdown plus message history. No embedding model, no network.
#
# memory:
#   retriever: fts5
#   dir: ./memory
#   k: 6
#   includeHistory: true

# ── Phase 4: channels, delivery, and the HTTP server ──────────────────────────────────────
# `allowFrom` is inbound-only. It confers nothing on outbound delivery, and conflating the two
# produces a confusing "chat not found" class of failure.
#
# channels:
#   - type: telegram
#     id: tg
#     enabled: true
#     mode: longpoll               # channel-specific fields reach the plugin's own schema
#     tokenEnv: TELEGRAM_BOT_TOKEN
#     allowFrom: ["@moeen"]
#   - type: whatsapp
#     id: wa
#     authDir: ./.castellan/wa-auth
#
# delivery:
#   default: tg                    # used when a turn has no origin — a schedule, or the API
#   targets:
#     owner: { channel: tg, to: "@moeen" }
#
# server:
#   enabled: false                 # enabling it is refused until Phase 4
#   host: 127.0.0.1                # a public bind is explicit, and requires a token
#   port: 7420
#   tokenEnv: CASTELLAN_API_TOKEN

# ── Phase 8: schedules ────────────────────────────────────────────────────────────────────
# Validated at write time rather than fire time. `deliver` is required — `{channel,to}` or the
# literal "none" to return results through the event stream only.
#
# schedules:
#   - id: morning-brief
#     kind: cron                   # cron | every | at
#     expr: "0 8 * * *"            # cron: 5 or 6 field · every: "15m" · at: ISO 8601, max +10y
#     task: "Summarise today's calendar and unread email."
#     deliver: { channel: tg, to: "@moeen" }
#     session: isolated            # or `shared:<key>`
#     enabled: true
#     timezone: Asia/Dhaka         # IANA name; defaults to TZ, then UTC

# ── Phase 9: plugins ──────────────────────────────────────────────────────────────────────
# Trusted in-process code, documented as such. Resolved at boot from this list; never installed
# at runtime.
#
# plugins:
#   - "@castellan/channel-telegram"
#   - spec: "./plugins/custom-metrics"
#     config: { endpoint: "http://localhost:9090" }
