apiVersion: castellan/v1
id: milo
name: Milo

model:
  main:
    id: ${MODEL_ID}
    baseUrl: ${MODEL_BASE_URL}
    apiKeyEnv: MODEL_API_KEY
    temperature: 0.3

context:
  workspace: ./workspace
  static:
    - AGENT.md
    - POLICY.md
  volatile:
    - USER.md
    - MEMORY.md
  reminder: REMINDER.md
  # Generous because a reasoning model bills its thinking here too.
  reserveOutput: 8192

limits:
  maxSteps: 4
  turnTimeoutMs: 120000
